---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3.40"

vars:
  IMPORT: github.com/gexec/gexec
  SERVER_BINARY: gexec-server
  RUNNER_BINARY: gexec-runner
  CLIENT_BINARY: gexec-client

tasks:
  clean:
    desc: Remove all temporary build artifacts
    cmds:
      - go clean -i ./...
      - rm -rf bin/ dist/ frontend/dist/ pkg/frontend/files/*

  generate:
    desc: Generate code like openapi clients
    deps:
      - be:generate
      - fe:generate

  be:fmt:
    desc: Run standard formatter for backend
    vars:
      SOURCES:
        sh: find . -name "*.go" -type f -not -iname mock.go | xargs echo
    cmds:
      - gofmt -s -w {{ .SOURCES }}

  be:vet:
    desc: Run vet linting for backend
    vars:
      PACKAGES:
        sh: go list ./... | xargs echo
    cmds:
      - go vet {{ .PACKAGES }}

  be:lint:
    desc: Run revive linting for backend
    vars:
      PACKAGES:
        sh: go list ./... | xargs echo
    cmds:
      - for PKG in {{ .PACKAGES }}; do go tool github.com/mgechev/revive -config revive.toml -set_exit_status $PKG || exit 1; done;

  be:golangci:
    desc: Run golangci linter for backend
    cmds:
      - go tool github.com/golangci/golangci-lint/v2/cmd/golangci-lint run ./...

  be:generate:
    desc: Generate code for backend
    vars:
      PACKAGES:
        sh: go list ./... | xargs echo
    cmds:
      - go generate {{ .PACKAGES }}

  be:test:
    desc: Run tests for backend
    vars:
      PACKAGES:
        sh: go list ./... | xargs echo
    cmds:
      - go test -coverprofile coverage.out {{ .PACKAGES }}

  be:build:
    desc: Build all required binary artifacts
    deps:
      - build:server
      - build:runner
      - build:client

  fe:install:
    desc: Install dependencies for frontend
    cmds:
      - npm install --ci

  fe:fmt:
    desc: Run standard formatter for frontend
    cmds:
      - npm run format

  fe:lint:
    desc: Run configured linters for frontend
    cmds:
      - npm run lint

  fe:generate:
    desc: Generate code for frontend
    cmds:
      - npm run openapi

  fe:test:
    desc: Run tests for frontend
    cmds:
      - npm run test

  fe:build:
    desc: Build entire project for frontend
    cmds:
      - npm run build

  build:release:
    desc: Generate a release with goreleaser
    cmds:
      - goreleaser release --clean

  build:snapshot:
    desc: Generate a snapshot with goreleaser
    cmds:
      - goreleaser release --clean --snapshot --skip=announce,publish,validate,sign

  build:server:
    desc: Build server component
    cmds:
      - go build -v
          -tags 'netgo'
          -ldflags '-s -w -extldflags "-static" -X "{{ .IMPORT }}/pkg/version.String={{ .VERSION }}" -X "{{ .IMPORT }}/pkg/version.Revision={{ .REVISION }}" -X "{{ .IMPORT }}/pkg/version.Date={{ now | date "20060102" }}"'
          -o bin/{{.SERVER_BINARY}}{{if eq OS "windows"}}.exe{{end}}
          ./cmd/{{.SERVER_BINARY}}
    env:
      CGO_ENABLED: "0"
      GOOS: "{{ .GOOS }}"
      GOARCH: "{{ .GOARCH }}"
    vars:
      VERSION:
        sh: if [[ -z "${CI_COMMIT_TAG}" ]]; then git rev-parse --short HEAD; else echo "${CI_COMMIT_TAG#v}"; fi
      REVISION:
        sh: git rev-parse --short HEAD
      GOOS:
        sh: go env GOOS
      GOARCH:
        sh: go env GOARCH

  build:runner:
    desc: Build runner component
    cmds:
      - go build -v
          -tags 'netgo'
          -ldflags '-s -w -extldflags "-static" -X "{{ .IMPORT }}/pkg/version.String={{ .VERSION }}" -X "{{ .IMPORT }}/pkg/version.Revision={{ .REVISION }}" -X "{{ .IMPORT }}/pkg/version.Date={{ now | date "20060102" }}"'
          -o bin/{{.RUNNER_BINARY}}{{if eq OS "windows"}}.exe{{end}}
          ./cmd/{{.RUNNER_BINARY}}
    env:
      CGO_ENABLED: "0"
      GOOS: "{{ .GOOS }}"
      GOARCH: "{{ .GOARCH }}"
    vars:
      VERSION:
        sh: if [[ -z "${CI_COMMIT_TAG}" ]]; then git rev-parse --short HEAD; else echo "${CI_COMMIT_TAG#v}"; fi
      REVISION:
        sh: git rev-parse --short HEAD
      GOOS:
        sh: go env GOOS
      GOARCH:
        sh: go env GOARCH

  build:client:
    desc: Build client component
    cmds:
      - go build -v
          -tags 'netgo'
          -ldflags '-s -w -extldflags "-static" -X "{{ .IMPORT }}/pkg/version.String={{ .VERSION }}" -X "{{ .IMPORT }}/pkg/version.Revision={{ .REVISION }}" -X "{{ .IMPORT }}/pkg/version.Date={{ now | date "20060102" }}"'
          -o bin/{{.CLIENT_BINARY}}{{if eq OS "windows"}}.exe{{end}}
          ./cmd/{{.CLIENT_BINARY}}
    env:
      CGO_ENABLED: "0"
      GOOS: "{{ .GOOS }}"
      GOARCH: "{{ .GOARCH }}"
    vars:
      VERSION:
        sh: if [[ -z "${CI_COMMIT_TAG}" ]]; then git rev-parse --short HEAD; else echo "${CI_COMMIT_TAG#v}"; fi
      REVISION:
        sh: git rev-parse --short HEAD
      GOOS:
        sh: go env GOOS
      GOARCH:
        sh: go env GOARCH

  watch:server:
    desc: Run reloading development server
    cmds:
      - task: build:server
      - bin/{{.SERVER_BINARY}} start
    watch: true
    method: none
    sources:
      - 'cmd/**/*.go'
      - 'pkg/**/*.go'
      - 'pkg/**/*.tmpl'
    env:
      GEXEC_LOG_LEVEL: "{{ .GEXEC_LOG_LEVEL | default \"debug\" }}"
      GEXEC_TOKEN_SECRET: "NTaCR5JztYujaOZNgesaUzaVPmoxkGo0"
      GEXEC_ENCRYPT_PASSPHRASE: "aZRNei17y80b9iDR9fSqryhLzlk28OHZ"

  watch:runner:
    desc: Run reloading development runner
    cmds:
      - task: build:runner
      - bin/{{.RUNNER_BINARY}} start
    watch: true
    method: none
    sources:
      - 'cmd/**/*.go'
      - 'pkg/**/*.go'
      - 'pkg/**/*.tmpl'
    env:
      GEXEC_LOG_LEVEL: "{{ .GEXEC_LOG_LEVEL | default \"debug\" }}"
      GEXEC_TOKEN_SECRET: "NTaCR5JztYujaOZNgesaUzaVPmoxkGo0"
      GEXEC_ENCRYPT_PASSPHRASE: "aZRNei17y80b9iDR9fSqryhLzlk28OHZ"

  watch:client:
    desc: Run reloading development client
    cmds:
      - task: build:client
    watch: true
    method: none
    sources:
      - 'cmd/**/*.go'
      - 'pkg/**/*.go'
      - 'pkg/**/*.tmpl'

  watch:frontend:
    desc: Run reloading development frontend
    cmds:
      - task: fe:install
      - npm run serve

...
