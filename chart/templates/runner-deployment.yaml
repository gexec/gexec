apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ include "gexec.fullname" . }}-runner
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gexec.runner.labels" . | nindent 4 }}
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}

spec:
  replicas: {{ .Values.runner.replicas }}
  revisionHistoryLimit: 3
  {{- if .Values.updateStrategy }}

  strategy:
    {{- toYaml .Values.updateStrategy | nindent 4 }}
  {{- end }}

  selector:
    matchLabels:
      {{- include "gexec.runner.selectorLabels" . | nindent 6 }}

  template:
    metadata:
      labels:
        {{- include "gexec.runner.labels" . | nindent 8 }}
      {{- if or .Values.annotations .Values.runner.podAnnotations }}
      annotations:
        {{- if .Values.annotations }}
        {{- toYaml .Values.annotations | nindent 8 }}
        {{- end }}
        {{- if .Values.runner.podAnnotations }}
        {{- toYaml .Values.runner.podAnnotations | nindent 8 }}
        {{- end }}
      {{- end }}

    spec:
      serviceAccountName: {{ include "gexec.serviceAccountName" . }}
      {{- if .Values.pullSecrets }}

      imagePullSecrets:
      {{- range .Values.pullSecrets }}
        - name: {{ . }}
      {{- end }}
      {{- end }}
      {{- with .Values.runner.securityContext }}

      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.runner.extraInitContainers }}

      initContainers:
        {{- toYaml .Values.runner.extraInitContainers | nindent 8 }}
      {{- end }}

      containers:
        - name: gexec-runner
          image: {{ .Values.runner.image.repository }}:{{ .Values.runner.image.tag | default .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.runner.image.pullPolicy }}
          {{- with .Values.runner.podSecurityContext }}

          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          env:
            {{- include "gexec.runner.environment" . | nindent 12 }}

          ports:
            - name: http
              protocol: TCP
              containerPort: {{ .Values.runner.service.port }}
            - name: metrics
              protocol: TCP
              containerPort: {{ .Values.runner.metrics.internalPort }}
          {{- if .Values.runner.resources }}

          resources:
            {{- toYaml .Values.runner.resources | nindent 12 }}
          {{- end }}

          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            failureThreshold: 5
            initialDelaySeconds: 10
            periodSeconds: 2
            successThreshold: 1
            timeoutSeconds: 3

          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            failureThreshold: 5
            initialDelaySeconds: 10
            periodSeconds: 2
            successThreshold: 1
            timeoutSeconds: 3
          {{- if .Values.runner.extraVolumeMounts }}

          volumeMounts:
            {{- toYaml .Values.runner.extraVolumeMounts | nindent 12 }}
          {{- end }}
        {{- if .Values.runner.extraSidecarContainers }}

        {{- toYaml .Values.runner.extraSidecarContainers | nindent 8 }}
        {{- end }}
      {{- if .Values.runner.extraVolumes }}

      volumes:
        {{- toYaml .Values.runner.extraVolumes | nindent 8 }}
      {{- end }}
